  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#07131c">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="קורס חובשים אשדוד 497">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="חובשים 497">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./unified.css">

<body>
<div class="app-shell review-shell">
<header class="course-topbar"></header>
<main class="app">
  <section id="home">
    <div id="resumeBox"></div>
    <section class="hub-head">
      <div><span class="kicker">חלק א׳</span><h1>החייאה ויסודות</h1><p>אנטומיה, החייאה, AED, חנק ועבודה בשטח. אפשר להתחיל מכל מקום.</p></div>
      <div class="hub-stats" id="hubStats"></div>
    </section>
    <section class="game-menu" aria-labelledby="h-practice">
      <h2 id="h-practice">תרגול</h2>
      <div class="game-options">
        <button class="game-option featured" type="button" id="dailyBtn"><span class="mode-icon" aria-hidden="true">📅</span><b>תרגול יומי</b><small>12 שאלות: טעויות שהגיע זמנן, הקטגוריה החלשה ושאלות חדשות</small></button>
        <button class="game-option" type="button" id="bankBtn"><span class="mode-icon" aria-hidden="true">🎯</span><b>בנק הטעויות</b><small id="bankLabel"></small></button>
        <button class="game-option" type="button" id="examBtn"><span class="mode-icon" aria-hidden="true">📝</span><b>מבחן לדוגמה</b><small>40 שאלות, 45 דקות, ציון בסוף</small></button>
        <button class="game-option" type="button" id="survivalBtn"><span class="mode-icon" aria-hidden="true">♥</span><b>אתגר שלושה לבבות</b><small>שאלות מכל הקטגוריות. שלוש טעויות והאתגר נגמר</small></button>
      </div>
    </section>
    <section class="game-menu" aria-labelledby="h-games">
      <h2 id="h-games">משחקי החייאה</h2>
      <div class="game-options">
        <button class="game-option" type="button" id="resusBtn"><span class="mode-icon" aria-hidden="true">🚨</span><b>תרחישי החייאה</b><small>החלטות צעד אחר צעד במצבים שונים</small></button>
        <button class="game-option" type="button" id="seqBtn"><span class="mode-icon" aria-hidden="true">🧩</span><b>סדר את הטיפול</b><small>מסדרים פעולות לפי הסדר הנכון</small></button>
        <button class="game-option" type="button" id="memoryBtn"><span class="mode-icon" aria-hidden="true">🧠</span><b>משחק הזיכרון</b><small>מושג והגדרה. זוגות אחרים בכל משחק</small></button>
        <button class="game-option" type="button" id="rhythmBtn"><span class="mode-icon" aria-hidden="true">🥁</span><b>מאמן קצב עיסויים</b><small>מקישים בקצב, 30:2. מודד קצב והפסקות</small></button>
        <button class="game-option" type="button" id="aedBtn"><span class="mode-icon" aria-hidden="true">⚡</span><b>מחזור AED בזמן אמת</b><small>מעסים, עוזבים לאנליזה ושוק, וחוזרים מהר</small></button>
        <button class="game-option" type="button" id="whatnowBtn"><span class="mode-icon" aria-hidden="true">⏱️</span><b>מה עכשיו?</b><small>מקרה אקראי, 10 שניות להחליט, שלושה לבבות</small></button>
        <button class="game-option" type="button" id="branchBtn"><span class="mode-icon" aria-hidden="true">🔀</span><b>תרחישים מתפצלים</b><small>כל החלטה נשארת ומשנה את המשך האירוע</small></button>
      </div>
    </section>
    <div class="section-title" id="categoryTitle"><h3>לפי קטגוריה</h3><span>13 קטגוריות לפי סדר הקורס</span></div>
    <section class="levels" id="levels"></section>
  </section>
  <section id="play" class="game hidden"></section>
  <section id="resus" class="game hidden"></section>
  <section id="seq" class="game hidden"></section>
  <section id="memory" class="game hidden"></section>
  <section id="rhythm" class="game hidden"></section>
  <section id="aed" class="game hidden"></section>
  <section id="whatnow" class="game hidden"></section>
  <section id="branch" class="game hidden"></section>
</main>
<footer class="course-footer"><span>הוכן על ידי אלעזר מושקוביץ עבור קורס חובשים אשדוד 497</span><span>עזר ללמידה לקראת המבחן ולשטח. לא מחליף את חומר הקורס ואת ההנחיות של המדריך ר׳ יחיאל מייברג.</span></footer>
</div>
